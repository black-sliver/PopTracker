# Fuzz testing with latest clang.
# This also acts as compiler test because it'll automatically pull latest minor.patch update
# for a given clang version. Major version needs to be incremented manually.
name: Fuzz

on:
  workflow_dispatch:
  schedule:
  - cron: "13 4 * * *"  # every day at 04:13

permissions: {}

jobs:
  fuzz:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            shell: bash
            llvm-version: 23

    name: Fuzz
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - uses: actions/checkout@v7.0.1
        timeout-minutes: 5
        with:
          submodules: recursive
      - name: Install dependencies (apt)
        timeout-minutes: 5
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install coreutils build-essential meson \
            libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libgtest-dev libgmock-dev
      - name: Install newer Clang (ubuntu)
        timeout-minutes: 5
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x ./llvm.sh
          sudo ./llvm.sh ${{ matrix.llvm-version }} all
          sudo apt install clang-tools-${{ matrix.llvm-version }}
          # put version into .clang-version for cache key
          clang-${{ matrix.llvm-version }} --version > .clang-version
      - name: Cache/Restore fuzzer
        id: cache-fuzzer
        uses: actions/cache@v6.1.0
        with:
          path: build/test/fuzzer
          key: fuzz-${{ matrix.os }}-exe-v1-${{ hashFiles('./.clang-version', './meson.build', './src/**', './lib/**', './bench/**', './test/**') }}
          # increment -v1- when Build fuzzer step or hashFiles() changes
      - name: Build fuzzer
        if: steps.cache-fuzzer.outputs.cache-hit != 'true'
        run: |
          CC=clang-${{ matrix.llvm-version }} \
          CXX=clang++-${{ matrix.llvm-version }} \
          AR=llvm-ar-${{ matrix.llvm-version }} \
            meson setup -Dauto-lto=false --buildtype debugoptimized -Doptimization=2 -Db_sanitize=address,undefined build
          meson compile -C build fuzzer
      - name: Restore corpus
        id: restore-corpus
        uses: actions/cache/restore@v6.1.0
        with:
          path: corpus
          restore-keys: |
            fuzz-${{ runner.os }}-corpus-
            fuzz-${{ runner.os }}-corpus
          key: fuzz-${{ runner.os }}-corpus-${{ github.run_number }}-${{ github.run_attempt }}  # should be unique and not exist
      - name: Update corpus
        run: |
          mkdir -p corpus
          python test/core/tools/make_zip.py
          ./build/test/fuzzer -merge=1 corpus test/core/data
      - name: Run fuzzer
        run: ./build/test/fuzzer -max_total_time=897 -workers=4 -jobs=4 corpus/
      - name: Store logs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: log
          path: fuzz-*.log
          compression-level: 9
          if-no-files-found: error
          retention-days: 3
      - name: Store oom
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: oom
          path: oom-*
          if-no-files-found: ignore
          retention-days: 3
      - name: Store crashes
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: crash
          path: crash-*
          if-no-files-found: ignore
          retention-days: 3
      - name: Compress corpus
        if: always()
        run: |
          mkdir new-corpus
          ./build/test/fuzzer -merge=1 new-corpus corpus && rm -r corpus && mv new-corpus corpus
      - name: Save corpus
        if: always()
        uses: actions/cache/save@v6.1.0
        with:
          path: corpus
          key: ${{ steps.restore-corpus.outputs.cache-primary-key }}
