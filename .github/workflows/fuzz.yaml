name: Fuzz
on:
  workflow_dispatch:
  schedule:
  - cron: "0 4 * * *"

permissions: {}

jobs:
  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies (apt)
        timeout-minutes: 5
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install coreutils build-essential meson \
            libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libgtest-dev libgmock-dev
      - name: Install newer Clang (ubuntu)
        timeout-minutes: 5
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x ./llvm.sh
          sudo ./llvm.sh 22 all
          sudo apt install clang-tools-22
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - name: Build fuzzer
        run: |
          CC=clang-22 CXX=clang++-22 AR=llvm-ar-22 \
            meson setup --buildtype debugoptimized -Doptimization=g -Db_sanitize=address,undefined build
          meson compile -C build fuzzer
      - name: Restore corpus
        id: restore-corpus
        uses: actions/cache/restore@v6.1.0
        with:
          path: corpus
          restore-keys: |
            fuzz-${{ runner.os }}-corpus-
            fuzz-${{ runner.os }}-corpus
          key: fuzz-${{ runner.os }}-corpus-${{ github.run_number }}-${{ github.run_attempt }}  # should be unique and not exist
      - name: Update corpus
        run: |
          mkdir -p corpus
          python test/core/tools/make_zip.py
          ./build/test/fuzzer -merge=1 corpus test/core/data
      - name: Run fuzzer
        run: ./build/test/fuzzer -max_total_time=897 -workers=4 -jobs=4 corpus/
      - name: Store logs
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: log
          path: fuzz-*.log
          compression-level: 9
          if-no-files-found: error
          retention-days: 3
      - name: Store oom
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: oom
          path: oom-*
          if-no-files-found: ignore
          retention-days: 3
      - name: Store crashes
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: crash
          path: crash-*
          if-no-files-found: ignore
          retention-days: 3
      - name: Compress corpus
        if: always()
        run: |
          mkdir new-corpus
          ./build/test/fuzzer -merge=1 new-corpus corpus && rm -r corpus && mv new-corpus corpus
      - name: Save corpus
        if: always()
        uses: actions/cache/save@v6.1.0
        with:
          path: corpus
          key: ${{ steps.restore-corpus.outputs.cache-primary-key }}
