name: Find typos

on:
  push:
  pull_request:

permissions: {}

jobs:
  codespell:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - uses: actions/checkout@v7.0.1
    - uses: codespell-project/actions-codespell@e3258cca84ce02b0bb36a3d41f2c18f719a0cc1a  # v2.4.3
      with:
        check_filenames: true
        check_hidden: true
