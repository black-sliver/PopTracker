name: Native Code Static Analysis

on:
  push:
    paths:
      - '**.c'
      - '**.cc'
      - '**.cpp'
      - '**.cxx'
      - '**.h'
      - '**.hh'
      - '**.hpp'
      - '**.ipp'
      - '.github/workflows/scan-build.yaml'
  pull_request:
    paths:
      - '**.c'
      - '**.cc'
      - '**.cpp'
      - '**.cxx'
      - '**.h'
      - '**.hh'
      - '**.hpp'
      - '**.ipp'
      - '.github/workflows/scan-build.yaml'

concurrency:
  # Cancels pending runs when a PR gets updated. (For push we'd use ref.)
  group: "${{ github.workflow }}-${{ github.head_ref || github.run_id }}-${{ github.actor }}"
  cancel-in-progress: true

permissions: {}

jobs:
  scan-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell: bash
            llvm-version: 22
          # scan-build broken in msys2 mingw-w64-x86_64
          #- os: windows-latest
          #  shell: msys2 {0}

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - name: Install dependencies (apt)
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
        timeout-minutes: 5
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install coreutils build-essential meson \
            libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libgtest-dev libgmock-dev
      - name: Install dependencies (msys2)
        if: ${{ startsWith(matrix.os, 'windows') }}
        timeout-minutes: 5
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884  # v2.32.0
        with:
          release: false
          update: false
          install: >-
            base-devel
            coreutils
            make
            mingw-w64-x86_64-toolchain
            mingw64/mingw-w64-x86_64-SDL2
            mingw64/mingw-w64-x86_64-SDL2_image
            mingw64/mingw-w64-x86_64-SDL2_ttf
            mingw64/mingw-w64-x86_64-freetype
            mingw64/mingw-w64-x86_64-openssl
            mingw64/mingw-w64-x86_64-gtest
            mingw64/mingw-w64-x86_64-clang-analyzer
            mingw64/mingw-w64-x86_64-perl
            mingw64/mingw-w64-x86_64-meson
            p7zip
      - name: Install newer Clang and scan-build command (ubuntu)
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
        timeout-minutes: 5
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x ./llvm.sh
          sudo ./llvm.sh ${{ matrix.llvm-version }}
          sudo apt install clang-tools-${{ matrix.llvm-version }}
      - name: scan-build
        run: |
          meson setup build
          SCANBUILD=../contrib/scan-build-wrapper/scan-build.sh \
            ninja -C build scan-build
      - name: Store report
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: scan-build-reports-${{ matrix.os }}
          path: build/meson-logs/scanbuild
